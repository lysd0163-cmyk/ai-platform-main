services:
  api:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.api
    environment:
      PORT: 4000
    ports:
      - "4000:4000"
    depends_on:
      - postgres
      - redis
  web:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.web
    environment:
      PORT: 3000
      API_URL: http://api:4000
    ports:
      - "3000:3000"
    depends_on:
      - api
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ai_os
      POSTGRES_USER: ai_os
      POSTGRES_PASSWORD: local_dev_only
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
volumes:
  postgres_data:
