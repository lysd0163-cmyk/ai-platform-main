services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ai_os
      POSTGRES_USER: ai_os
      POSTGRES_PASSWORD: local_dev_only
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
